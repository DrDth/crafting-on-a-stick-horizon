[package]
name = "crafting_on_a_stick"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
# Until a Nightly has open_station (horizon-rust/horizon#18364, merged), the mod builds inside a
# Horizon checkout, from `.local/dev-mods/crafting_on_a_stick` (see README.md); then this becomes
# the pinned SDK path `cargo horizon-mod` writes.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }

# A mod is its own project, not a member of the game's workspace.
[workspace]
