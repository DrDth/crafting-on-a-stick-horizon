[package]
name = "crafting_on_a_stick"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
# While open_station (horizon-rust/horizon#18364) is unreleased, the mod builds inside a Horizon
# checkout that has it, from `.local/dev-mods/crafting_on_a_stick` (see README.md); once a Nightly
# has it, this becomes the pinned SDK path `cargo horizon-mod` writes.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }

# A mod is its own project, not a member of the game's workspace.
[workspace]
